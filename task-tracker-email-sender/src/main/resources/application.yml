logging:
  level:
    # 1. Вывод самого SQL-запроса
    org.hibernate.SQL: DEBUG
    # 2. Вывод значений параметров (для Hibernate 6+)
    org.hibernate.orm.jdbc.bind: TRACE
    # 3. Вывод результатов извлечения данных (опционально)
    org.hibernate.orm.jdbc.extract: TRACE
    # 4. Логирование пула соединений HikariCP (для отладки соединений)
    com.zaxxer.hikari: DEBUG
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.springframework.transaction.interceptor: TRACE
server:
  port: 8077

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: task-tracker-email-sender
  datasource:
    url: jdbc:postgresql://localhost:5440/email-sender-db
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    #    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: changelog-master.xml
  mail:
    host: smtp.mail.ru
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: "task-tracker-email-sender"
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.type.mapping: >
        userCreated:io.roadmap.tasktrackeremailsender.dto.KafkaCreateUserMessage,
        emailReport:io.roadmap.tasktrackeremailsender.dto.EmailReportForUser
      spring.json.trusted.packages: "io.roadmap.tasktrackeremailsender.dto"
app:
  kafka:
    topic:
      email-requested: "notifications.email.requested"