logging:
  level:
    # 1. Вывод самого SQL-запроса
    org.hibernate.SQL: DEBUG
    # 2. Вывод значений параметров (для Hibernate 6+)
    org.hibernate.orm.jdbc.bind: TRACE
    # 3. Вывод результатов извлечения данных (опционально)
    org.hibernate.orm.jdbc.extract: TRACE
    # 4. Логирование пула соединений HikariCP (для отладки соединений)
    com.zaxxer.hikari: DEBUG
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.springframework.transaction.interceptor: TRACE
spring:
  webflux:
      base-path: /api
  application:
    name: "task-tracker-backend"
  datasource:
    url: jdbc:postgresql://localhost:5440/todolist
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
#    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: changelog-master.xml

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      client-id: sample-producer
      acks: all
      key-serializer: org.apache.kafka.common.serialization.IntegerSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 5000
        delivery.timeout.ms: 1000
        request.timeout.ms: 300
        retries: 1
        spring.json.type.mapping: userRegistered:io.roadmap.tasktracker.backend.dto.UserRegisteredEvent

jwt:
  secret: secretKeysecretKeysecretKeysecretKeysecretKeysecretKey
  expiration-hours: 1
app:
  kafka:
    topic:
      notifications-email-requested: "notifications.email.requested"