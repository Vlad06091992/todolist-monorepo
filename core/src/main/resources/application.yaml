spring:
  application:
    name: "todo"
  datasource:
    url: jdbc:postgresql://localhost:5440/todolist
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: changelog-master.xml
jwt:
  secret: secretKeysecretKeysecretKeysecretKeysecretKeysecretKey
  expiration-hours: 1